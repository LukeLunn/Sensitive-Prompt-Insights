[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensitive-prompt-insights"
version = "0.1.0"
description = "Detecting sensitive data in GenAI prompts and summarising usage with calibrated uncertainty."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.1.0",
    "huggingface-hub>=2.4.0",
    "pandas>=3.1,!=3.1.1",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
    "pandas-stubs>=3.1.0.261029",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true

# datasets publishes no type information (no py.typed or stubs).
[[tool.mypy.overrides]]
module = ["datasets", "datasets.*"]
ignore_missing_imports = true
