[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sensitive-prompt-insights"
version = "0.1.0"
description = "Detecting sensitive data in GenAI prompts and summarising usage with calibrated uncertainty."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
